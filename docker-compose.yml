services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/pdos
      LOG_LEVEL: info
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      LEGACY_UPLOADS_DIR: /legacy-uploads
    volumes:
      - uploads:/legacy-uploads:ro
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  mongo-test:
    image: mongo:8
    profiles: ["test"]
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db

volumes:
  mongo-data:
  uploads:
